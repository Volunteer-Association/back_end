version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: back-end-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${SQL_DATABASE:-back_end}
      MYSQL_USER: ${SQL_USERNAME:-${SQL_UESRNAME:-app_user}}
      MYSQL_PASSWORD: ${SQL_PASSWORD:-app_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back-end-backend/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-end-backend
    restart: unless-stopped
    env_file:
      - ./back-end-backend/.env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      SERVER_IP: 0.0.0.0
      PORT: ${PORT:-3000}
      SQL_HOST: mysql
      SQL_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./back-end-frontend
      dockerfile: Dockerfile
    container_name: back-end-frontend
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${PORT:-3000}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: back-end-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
